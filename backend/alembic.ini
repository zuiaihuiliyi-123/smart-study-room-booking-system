[alembic]
script_location = alembic
prepend_sys_path = .
# The real URL is loaded by alembic/env.py from app.core.config; this is a placeholder only.
sqlalchemy.url = mysql+pymysql://study_app:CHANGE_ME_APP_PASSWORD@127.0.0.1:3306/smart_study_room?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
